        - generic [ref=f3e1514]:
          - heading "ns-exporter deployment" [level=1] [ref=f3e1515]
          - generic [ref=f3e1516]: ns-exporter deployment not working properly
          - heading "Overview" [level=2] [ref=f3e1517]
          - paragraph [ref=f3e1518]:
            - text: The
            - code [ref=f3e1519]: ns-exporter
            - text: is a small
            - link "Golang container" [ref=f3e1520] [cursor=pointer]:
              - /url: https://github.wdf.sap.corp/cc/ns-exporter/
            - text: that checks if a given OpenStack network has network connectivity and exports this information as a Prometheus metric. To get this information, we need to enter the network namespaces on a host and perform DNS resolutions, pings, and OpenStack queries. This is only possible with elevated privileges. Our
            - link "CI" [ref=f3e1521] [cursor=pointer]:
              - /url: https://ci1.eu-de-2.cloud.sap/teams/services/pipelines/ns-exporter/
            - text: deploys it as a DaemonSet via its
            - link "Helm chart" [ref=f3e1522] [cursor=pointer]:
              - /url: https://github.com/sapcc/helm-charts/blob/master/prometheus-exporters/ns-exporter/templates/daemonset.yaml
            - text: .
          - 'heading "Alerts: missing metrics and degraded DaemonSet" [level=2] [ref=f3e1523]'
          - paragraph [ref=f3e1524]:
            - text: The alert
            - code [ref=f3e1525]: NetworkNamespaceProbeMetricsMissing
            - text: monitors the number of total metrics being exported in a single region. If triggered, it indicates that
            - strong [ref=f3e1526]: ALL
            - code [ref=f3e1527]: ns-exporters
            - text: have stopped exporting metrics. This can be due to an outage, a failing deployment, invalid credentials, or other reasons.
          - paragraph [ref=f3e1528]:
            - text: The alert
            - code [ref=f3e1529]: NetworkNamespaceProbeDaemonSetDegradedCritical
            - text: checks that the number of containers in the DaemonSet with status
            - code [ref=f3e1530]: Ready
            - text: matches the number of expected ones (as many as hosts).
          - paragraph [ref=f3e1531]: "To debug these alerts, first check if the DaemonSet is correctly rolled out:"
          - code [ref=f3e1533]: ❯ k get daemonsets -n ns-exporter NAME DESIRED CURRENT READY UP-TO-DATE AVAILABLE NODE SELECTOR AGE ns-exporter 84 84 84 84 84 <none> 6y342d
          - paragraph [ref=f3e1534]:
            - text: "Action: Verify that there is no node selector preventing the deployment of the"
            - code [ref=f3e1535]: ns-exporter
            - text: on each host. If one exists, it should be removed after determining who set it and why. This can be checked in the kube-api audit logs on Octobus (filter for
            - code [ref=f3e1536]: "sap.cc.audit.source: \"kube-api\" and objectRef.namespace: \"ns-exporter\" and objectRef.resource: \"daemonsets\" and not objectRef.subresource: \"status\""
            - text: )
          - paragraph [ref=f3e1537]:
            - text: If the DaemonSet is correctly rolled out, proceed to investigate the logs of a single
            - code [ref=f3e1538]: ns-exporter
            - text: instance. This should already provide a hint if something is wrong.
          - paragraph [ref=f3e1539]: "As a reference, logs for a healthy pod look similar to this:"
          - code [ref=f3e1541]: "❯ kubectl logs -n ns-exporter $(kubectl get pods -n ns-exporter -o jsonpath='{.items[0].metadata.name}') 2026/07/16 09:16:06 Start serving metrics on :9191 2026/07/16 09:16:06 Start metric collector 2026/07/16 09:16:06 Start signal handler 2026/07/15 16:18:58 Processing 40 networks for agent neutron-network-agent-ap010-7 took 2.434738214s 2026/07/15 16:19:58 Processing 40 networks for agent neutron-network-agent-ap010-7 took 2.260108842s 2026/07/15 16:24:58 Processing 40 networks for agent neutron-network-agent-ap010-7 took 2.037753725s 2026/07/15 16:25:59 Probe failure. Network: {NETWORK_A - XXXXXXXX [10.180.66.3:53] XXXXXXXX}, err : read udp 10.180.66.3:47286->10.180.66.3:53: i/o timeout, proto: udp, host: 10.180.66.3:53 2026/07/15 16:25:59 Processing 40 networks for agent neutron-network-agent-ap010-7 took 3.797422228s ..."
          - generic [ref=f3e1542]:
            - text: "Last modified July 23, 2026:"
