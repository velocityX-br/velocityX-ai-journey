          - 'heading "OpenstackNeutronMonitorAgentHeartbeat: Impact" [level=3] [ref=f6e1839]'
          - paragraph [ref=f6e1840]: tbd
          - 'heading "OpenstackNeutronMonitorAgentHeartbeat: Potential Solution" [level=3] [ref=f6e1841]'
          - paragraph [ref=f6e1842]: tbd
          - heading "OpenstackNeutronNetworkSegmentsExhaustion" [level=3] [ref=f6e1843]
          - paragraph [ref=f6e1844]: "The available network segments allocation for a physical network are close to exhaustion (less than 20% of free segment allocations), possible solutions are:"
          - list [ref=f6e1845]:
            - listitem [ref=f6e1846]: Increase the segment range for the physical network - but devices behind the switch need to support the increased segment range.
            - listitem [ref=f6e1847]: Remove Networks from the physical network (e.g. by deleting orphaned ports in the segment of a network or disable DHCP)
          - paragraph [ref=f6e1848]: "Either solution should be handled with caution by Neutron experts, ask in Slack channel #neutron for help if unsure."
