          - 'heading "OpenstackNeutronDatapath:ping_google_dns {#test_ping_goole_dns}" [level=2] [ref=f6e1778]'
          - paragraph [ref=f6e1779]:
            - text: These tests run in the
            - code [ref=f6e1780]: blackbox-tests-certificates-*
            - text: pods in the blackbox namespace of the region.
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Test Case" [level=3] [ref=f6e1781]'
          - table [ref=f6e1784]:
            - rowgroup [ref=f6e1785]:
              - row [ref=f6e1786]:
                - cell [ref=f6e1787]:
                  - code [ref=f6e1789]: 1 2
                - cell "ping -c 1 8.8.8.8 ping -c 1 8.8.4.4" [ref=f6e1790]:
                  - code [ref=f6e1792]:
                    - generic [ref=f6e1793]: ping -c 1 8.8.8.8
                    - generic [ref=f6e1795]: ping -c 1 8.8.4.4
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Problem" [level=3] [ref=f6e1797]'
          - paragraph [ref=f6e1798]: Cannot access Google public DNS servers in the WAN/internet.
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Impact" [level=3] [ref=f6e1799]'
          - paragraph [ref=f6e1800]: Outbound connection to WAN/internet could be down.
          - paragraph [ref=f6e1801]: Inbound connection from the WAN/internet might be also affected. You can check this with Thousand Eyes Network Monitoring Tool if you have access.
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Potential Solution" [level=3] [ref=f6e1802]'
          - paragraph [ref=f6e1803]:
            - text: Do a
            - code [ref=f6e1804]: tracepath 8.8.8.8
            - text: and
            - code [ref=f6e1805]: tracepath 8.8.4.4
            - text: and compare if there are differences in the routing and were. It might also help to compare these path to a
            - code [ref=f6e1806]: traceroute 1.1.1.1
            - text: or something like
            - code [ref=f6e1807]: sap.com
            - text: /
            - code [ref=f6e1808]: heise.de
            - text: /
            - code [ref=f6e1809]: google.com
            - text: or similar. One might also compare the output to a tracepath from a different region. If only one IP is not reachable it might be a routing issue outside of our network(s).
          - paragraph [ref=f6e1810]: "If both IPs are not reachable and other places in the internet (i.e. heise, sap, google, facebook) are not reachable as well: Call the MiM hotline and ask that the WAN team get engaged."
          - heading "OpenstackNeutronPredictOutOfFIP" [level=2] [ref=f6e1811]
          - 'heading "OpenstackNeutronPredictOutOfFIP: Problem" [level=3] [ref=f6e1812]'
          - paragraph [ref=f6e1813]: Floating IP’s possibly soon exhausted.
          - 'heading "OpenstackNeutronPredictOutOfFIP: Impact" [level=3] [ref=f6e1814]'
          - paragraph [ref=f6e1815]: Customers cannot create and assign floating IP’s to servers.
          - 'heading "OpenstackNeutronPredictOutOfFIP: Potential Solution" [level=3] [ref=f6e1816]'
          - paragraph [ref=f6e1817]: Contact Neutron team (Benjamin Tinney, Sebastian Wagner) for adding another subnet in exhausted FIPs network.
          - heading "OpenstackNeutronDhcpAgentLostNetworks" [level=2] [ref=f6e1818]
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Test Case" [level=3] [ref=f6e1819]'
          - list [ref=f6e1820]:
            - listitem [ref=f6e1821]:
              - paragraph [ref=f6e1822]:
                - text: Count all subnets which have DHCP enabled
                - code [ref=f6e1823]: openstack subnet list --dhcp -f value -c Network
            - listitem [ref=f6e1824]:
              - paragraph [ref=f6e1825]:
                - text: Count networks managed by DHCP agent
                - code [ref=f6e1826]: "neutron net-list-on-dhcp-agent {id} -f value -c id"
            - listitem [ref=f6e1827]:
              - paragraph [ref=f6e1828]: Raise an error if the agent has less amount of subnet’s where dhcp is enabled
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Problem" [level=3] [ref=f6e1829]'
          - paragraph [ref=f6e1830]: DHCP agent has less subnets than subnets where dhcp is enabled.
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Impact" [level=3] [ref=f6e1831]'
          - paragraph [ref=f6e1832]: New servers does not get an IP address.
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Potential Solution" [level=3] [ref=f6e1833]'
          - paragraph [ref=f6e1834]:
            - text: On network agents being restarted it can happen that private network losing their hosting dhcp agents. See
            - link "DHCP Down playbook" [ref=f6e1835] [cursor=pointer]:
              - /url: https://operations.global.cloud.sap/docs/support/playbook/neutron/dhcp_down/
            - text: for help.
