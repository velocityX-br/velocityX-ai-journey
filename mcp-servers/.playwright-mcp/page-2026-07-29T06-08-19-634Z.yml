          - 'heading "OpenstackNeutronDatapath:lbaas_server: Potential Issues" [level=3] [ref=f7e1714]'
          - list [ref=f7e1715]:
            - listitem [ref=f7e1716]:
              - paragraph [ref=f7e1717]: Check Sentry for error details.
            - listitem [ref=f7e1718]:
              - paragraph [ref=f7e1719]: Check the connectivity chain from left to right.
            - listitem [ref=f7e1720]:
              - paragraph [ref=f7e1721]:
                - text: Connect to
                - emphasis [ref=f7e1722]: ccloud jump server
                - text: "floating ip fails:"
              - list [ref=f7e1723]:
                - listitem [ref=f7e1724]:
                  - text: If the jump server is not responding, refer to
                  - link "jump host playbook" [ref=f7e1725] [cursor=pointer]:
                    - /url: "#test_jump"
                  - text: for help.
            - listitem [ref=f7e1726]:
              - paragraph [ref=f7e1727]: Check the NAT rules on the ASR router.
            - listitem [ref=f7e1728]:
              - paragraph [ref=f7e1729]: Check health state of the load balancer.
            - listitem [ref=f7e1730]:
              - paragraph [ref=f7e1731]: Check health state of the load balancer pool member(s).
            - listitem [ref=f7e1732]:
              - paragraph [ref=f7e1733]:
                - text: The load balancer is accessing the pool members
                - emphasis [ref=f7e1734]: "datapath_server_{availability_zone}"
                - text: on port 22 through their private IP address.
              - list [ref=f7e1735]:
                - listitem [ref=f7e1736]:
                  - text: Check this connection from the project jump host which lives in the same private network as the
                  - emphasis [ref=f7e1737]: "datapath_server_{availability_zone}"
                  - text: servers.
                - listitem [ref=f7e1738]: Check this connection from the F5 device which hosts the load balancer.
          - 'heading "OpenstackNeutronDatapath:lbaas_server: Potential Solution" [level=3] [ref=f7e1739]'
          - list [ref=f7e1740]:
            - listitem [ref=f7e1741]: Check if FIP is attached to static lbaas server.
            - listitem [ref=f7e1742]: Reboot server if issue is not fixed
          - 'heading "OpenstackNeutronDatapath:jump {#test_jump}" [level=2] [ref=f7e1743]'
          - 'heading "OpenstackNeutronDatapath:jump: Health Dashboard" [level=3] [ref=f7e1744]'
          - paragraph [ref=f7e1745]: Defined at Datapath section of health dashboard.
          - figure [ref=f7e1746]:
            - heading "Image Alt Text" [level=4] [ref=f7e1749]
          - paragraph
          - 'heading "OpenstackNeutronDatapath:jump: Test Case" [level=3] [ref=f7e1750]'
          - table [ref=f7e1753]:
            - rowgroup [ref=f7e1754]:
              - row [ref=f7e1755]:
                - cell [ref=f7e1756]:
                  - code [ref=f7e1758]: "1"
                - 'cell "nc -v -z -w 3 jump01|jump02.cc.${region}.cloud.sap 22" [ref=f7e1759]':
                  - code [ref=f7e1761]:
                    - generic [ref=f7e1762]: "nc -v -z -w 3 jump01|jump02.cc.${region}.cloud.sap 22"
          - 'heading "OpenstackNeutronDatapath:jump: Problem" [level=3] [ref=f7e1764]'
          - paragraph [ref=f7e1765]: Cannot connect to Jump Host on port 22.
          - 'heading "OpenstackNeutronDatapath:jump: Impact" [level=3] [ref=f7e1766]'
          - paragraph [ref=f7e1767]:
            - text: Although if both jump hosts in a region are not accessible (
            - strong [ref=f7e1768]: critical
            - text: alert), our customers can use a jump host from another region to logon to their servers.
          - 'heading "OpenstackNeutronDatapath:jump: Potential Solution" [level=3] [ref=f7e1769]'
          - paragraph [ref=f7e1770]:
            - text: Restart the corresponding
            - link "VM" [ref=f7e1771] [cursor=pointer]:
              - /url: https://netbox.global.cloud.sap/virtualization/virtual-machines/?q=jump
            - text: in the vCenter.
            - strong [ref=f7e1772]: or
            - text: Silence the alert and contact D060607, D066607 or D042653 immediately during office hours.
          - 'heading "OpenstackNeutronDatapath:logon_jump {#test_logon_jump}" [level=2] [ref=f7e1773]'
          - 'heading "OpenstackNeutronDatapath:logon_jump: Health Dashboard" [level=3] [ref=f7e1774]'
          - paragraph [ref=f7e1775]: Defined at Datapath section of health dashboard.
          - figure [ref=f7e1776]:
            - heading "Image Alt Text" [level=4] [ref=f7e1779]
          - paragraph
          - 'heading "OpenstackNeutronDatapath:logon_jump: Test Case" [level=3] [ref=f7e1780]'
          - table [ref=f7e1783]:
            - rowgroup [ref=f7e1784]:
              - row [ref=f7e1785]:
                - cell [ref=f7e1786]:
                  - code [ref=f7e1788]: "1"
                - 'cell "ssh health@jump01|jump02.cc.${region}.cloud.sap ''hostname''" [ref=f7e1789]':
                  - code [ref=f7e1791]:
                    - generic [ref=f7e1792]: "ssh health@jump01|jump02.cc.${region}.cloud.sap 'hostname'"
          - 'heading "OpenstackNeutronDatapath:logon_jump: Problem" [level=3] [ref=f7e1794]'
          - paragraph [ref=f7e1795]: Cannot logon to the jump host.
          - 'heading "OpenstackNeutronDatapath:logon_jump: Impact" [level=3] [ref=f7e1796]'
          - paragraph [ref=f7e1797]:
            - text: Although if the health user cannot logon to both jump hosts in a region (
            - strong [ref=f7e1798]: critical
            - text: alert), our customers might not be affected because they are using RSA for logon. Can be mitigated by using a jump host from another region.
          - 'heading "OpenstackNeutronDatapath:logon_jump: Potential Solution" [level=3] [ref=f7e1799]'
          - paragraph [ref=f7e1800]:
            - text: General problems with jump host login are described
            - link "here" [ref=f7e1801] [cursor=pointer]:
              - /url: /docs/support/playbook/jumpserver_login_issues.html
            - text: .
          - 'heading "OpenstackNeutronDatapath:ping_google_dns {#test_ping_goole_dns}" [level=2] [ref=f7e1802]'
          - paragraph [ref=f7e1803]:
            - text: These tests run in the
            - code [ref=f7e1804]: blackbox-tests-certificates-*
            - text: pods in the blackbox namespace of the region.
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Test Case" [level=3] [ref=f7e1805]'
          - table [ref=f7e1808]:
            - rowgroup [ref=f7e1809]:
              - row [ref=f7e1810]:
                - cell [ref=f7e1811]:
                  - code [ref=f7e1813]: 1 2
                - cell "ping -c 1 8.8.8.8 ping -c 1 8.8.4.4" [ref=f7e1814]:
                  - code [ref=f7e1816]:
                    - generic [ref=f7e1817]: ping -c 1 8.8.8.8
                    - generic [ref=f7e1819]: ping -c 1 8.8.4.4
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Problem" [level=3] [ref=f7e1821]'
          - paragraph [ref=f7e1822]: Cannot access Google public DNS servers in the WAN/internet.
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Impact" [level=3] [ref=f7e1823]'
          - paragraph [ref=f7e1824]: Outbound connection to WAN/internet could be down.
          - paragraph [ref=f7e1825]: Inbound connection from the WAN/internet might be also affected. You can check this with Thousand Eyes Network Monitoring Tool if you have access.
          - 'heading "OpenstackNeutronDatapath:ping_google_dns: Potential Solution" [level=3] [ref=f7e1826]'
          - paragraph [ref=f7e1827]:
            - text: Do a
            - code [ref=f7e1828]: tracepath 8.8.8.8
            - text: and
            - code [ref=f7e1829]: tracepath 8.8.4.4
            - text: and compare if there are differences in the routing and were. It might also help to compare these path to a
            - code [ref=f7e1830]: traceroute 1.1.1.1
            - text: or something like
            - code [ref=f7e1831]: sap.com
            - text: /
            - code [ref=f7e1832]: heise.de
            - text: /
            - code [ref=f7e1833]: google.com
            - text: or similar. One might also compare the output to a tracepath from a different region. If only one IP is not reachable it might be a routing issue outside of our network(s).
          - paragraph [ref=f7e1834]: "If both IPs are not reachable and other places in the internet (i.e. heise, sap, google, facebook) are not reachable as well: Call the MiM hotline and ask that the WAN team get engaged."
          - heading "OpenstackNeutronPredictOutOfFIP" [level=2] [ref=f7e1835]
          - 'heading "OpenstackNeutronPredictOutOfFIP: Problem" [level=3] [ref=f7e1836]'
          - paragraph [ref=f7e1837]: Floating IP’s possibly soon exhausted.
          - 'heading "OpenstackNeutronPredictOutOfFIP: Impact" [level=3] [ref=f7e1838]'
          - paragraph [ref=f7e1839]: Customers cannot create and assign floating IP’s to servers.
          - 'heading "OpenstackNeutronPredictOutOfFIP: Potential Solution" [level=3] [ref=f7e1840]'
          - paragraph [ref=f7e1841]: Contact Neutron team (Benjamin Tinney, Sebastian Wagner) for adding another subnet in exhausted FIPs network.
          - heading "OpenstackNeutronDhcpAgentLostNetworks" [level=2] [ref=f7e1842]
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Test Case" [level=3] [ref=f7e1843]'
          - list [ref=f7e1844]:
            - listitem [ref=f7e1845]:
              - paragraph [ref=f7e1846]:
                - text: Count all subnets which have DHCP enabled
                - code [ref=f7e1847]: openstack subnet list --dhcp -f value -c Network
            - listitem [ref=f7e1848]:
              - paragraph [ref=f7e1849]:
                - text: Count networks managed by DHCP agent
                - code [ref=f7e1850]: "neutron net-list-on-dhcp-agent {id} -f value -c id"
            - listitem [ref=f7e1851]:
              - paragraph [ref=f7e1852]: Raise an error if the agent has less amount of subnet’s where dhcp is enabled
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Problem" [level=3] [ref=f7e1853]'
          - paragraph [ref=f7e1854]: DHCP agent has less subnets than subnets where dhcp is enabled.
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Impact" [level=3] [ref=f7e1855]'
          - paragraph [ref=f7e1856]: New servers does not get an IP address.
          - 'heading "OpenstackNeutronDhcpAgentLostNetworks: Potential Solution" [level=3] [ref=f7e1857]'
          - paragraph [ref=f7e1858]:
            - text: On network agents being restarted it can happen that private network losing their hosting dhcp agents. See
            - link "DHCP Down playbook" [ref=f7e1859] [cursor=pointer]:
              - /url: https://operations.global.cloud.sap/docs/support/playbook/neutron/dhcp_down/
            - text: for help.
          - heading "OpenstackNeutronMonitorAgentHeartbeat" [level=2] [ref=f7e1860]
          - 'heading "OpenstackNeutronMonitorAgentHeartbeat: Problem" [level=2] [ref=f7e1861]'
          - paragraph [ref=f7e1862]: Agent heartbeat is above 75 s.
          - 'heading "OpenstackNeutronMonitorAgentHeartbeat: Impact" [level=3] [ref=f7e1863]'
          - paragraph [ref=f7e1864]: tbd
          - 'heading "OpenstackNeutronMonitorAgentHeartbeat: Potential Solution" [level=3] [ref=f7e1865]'
          - paragraph [ref=f7e1866]: tbd
          - heading "OpenstackNeutronNetworkSegmentsExhaustion" [level=3] [ref=f7e1867]
          - paragraph [ref=f7e1868]: "The available network segments allocation for a physical network are close to exhaustion (less than 20% of free segment allocations), possible solutions are:"
          - list [ref=f7e1869]:
            - listitem [ref=f7e1870]: Increase the segment range for the physical network - but devices behind the switch need to support the increased segment range.
            - listitem [ref=f7e1871]: Remove Networks from the physical network (e.g. by deleting orphaned ports in the segment of a network or disable DHCP)
          - paragraph [ref=f7e1872]: "Either solution should be handled with caution by Neutron experts, ask in Slack channel #neutron for help if unsure."
          - generic [ref=f7e1873]:
            - text: "Last modified September 22, 2025:"
