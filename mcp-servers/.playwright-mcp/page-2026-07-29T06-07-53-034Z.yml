          - paragraph [ref=f5e1885]:
            - text: "The new neutron-network-agents consists only of 2 containers: the"
            - code [ref=f5e1886]: linuxbridge-agent
            - text: and the
            - code [ref=f5e1887]: dhcp-agent
            - text: . The linuxbridge agent creates from the multus based passed bond1 interface vlan-tagged subinterfaces and bridges them to the neutron dhcp namespaces that are running the network-isolated dnsmasq (DHCP, DNS) and haproxy (Metadata). It’s even possible to run multiple network-agent pods on the same Node.
