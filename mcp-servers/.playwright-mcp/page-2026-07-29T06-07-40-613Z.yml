          - heading "Neutron API Overloaded" [level=1] [ref=f4e1507]
          - generic [ref=f4e1508]: Neutron API overloaded
          - paragraph [ref=f4e1509]:
            - text: If the alert
            - code [ref=f4e1510]: OpenstackNeutronApiOverloaded
            - text: is fired, socket listener queue of the uWSGI Neutron API servers are not cleared.
          - paragraph [ref=f4e1511]:
            - text: The listener queue is a “waiting” queue that will hold incoming connections till a worker is free to process the request. By default, it’s able to handle up to 100 connections, after that it will start to drop new connections (which will result in
            - strong [ref=f4e1512]: HTTP Code 500
            - text: ).
          - heading "What to do" [level=2] [ref=f4e1513]
          - paragraph [ref=f4e1514]: "Check the uWSGI Grafana dashboard, if all Pods have full listener queues, just scale the deployment so the amount of total pods is increased, e.g. if a deployment has 3 pods, increase it to 4:"
          - table [ref=f4e1517]:
            - rowgroup [ref=f4e1518]:
              - row [ref=f4e1519]:
                - cell [ref=f4e1520]:
                  - code [ref=f4e1522]: "1"
                - cell "kubectl scale --replicas=4 deploy/neutron-server" [ref=f4e1523]:
                  - code [ref=f4e1525]:
                    - generic [ref=f4e1526]: kubectl scale --replicas=4 deploy/neutron-server
