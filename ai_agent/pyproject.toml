[project]
name = "agent-chat"
version = "0.1.0"
description = "Config-driven ReAct chat runtime on LangGraph + MCP. A YAML file changes the prompt, model, and tools; every config shares the same create_agent loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "veloxityX-ai-journey Contributors" },
]
keywords = ["langgraph", "mcp", "agent", "llm", "react", "enterprise"]

dependencies = [
  "langgraph>=1.0,<2.0",
  "langchain>=1.0,<2.0",
  "langchain-core>=0.3.0",
  "langchain-mcp-adapters>=0.3,<0.4",
  # langchain-mcp-adapters 0.3.x targets the mcp 1.x API (RequestContext lives
  # in mcp.shared.context there); mcp 2.0 removed it. Pin to the compatible line.
  "mcp>=1.9,<2.0",
  "langchain-anthropic>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "typer>=0.15.0",
  "rich>=13.9.0",
  # Web UI (FastAPI + SSE). starlette/httpx come in transitively; let uv resolve
  # fastapi against the already-present starlette line.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # Used directly by the built-in web_search tool. Already present transitively
  # (httpx backs the Anthropic/OpenAI SDKs and Starlette's TestClient); pinned
  # here to make the direct dependency explicit.
  "httpx>=0.27",
  "ai-observability",
  "authlib>=1.8.0",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=0.24",
  "ruff>=0.9.0",
]

[project.scripts]
"agent-chat" = "agent_chat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# static/ lives inside the package dir, so it's included automatically. We list
# it explicitly to make the frontend's inclusion in the wheel obvious/robust.
packages = ["src/agent_chat"]
artifacts = ["src/agent_chat/static/**/*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_chat"]

[tool.uv.sources]
ai-observability = { path = "../packages/ai-observability", editable = true }

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--tb=short",
  "--strict-markers",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=0.24",
  "ruff>=0.9.0",
]
